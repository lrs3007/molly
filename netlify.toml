[build]
  base = "math-garden"
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/qwen3/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
